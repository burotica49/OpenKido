name: CI

on:
  push:
    branches: [main]
  pull_request:

# Jeton en lecture seule par défaut ; chaque job ne reçoit que ce dont il a besoin.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Vulnérabilités des dépendances de production
        run: npm audit --omit=dev --audit-level=high

      # 1 erreur préexistante (src/components/app/org-selector.tsx) : à corriger avant de rendre ce contrôle bloquant.
      - name: Lint
        run: npx eslint src --quiet
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
